name: Authorized target assessment
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
permissions:
  contents: read
concurrency:
  group: authorized-target-scan
  cancel-in-progress: false
jobs:
  scan:
    if: ${{ vars.DAST_ENABLED == 'true' && vars.DAST_TARGET != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Production profile assessment
        env:
          DAST_TARGET: ${{ vars.DAST_TARGET }}
        run: dast scan "$DAST_TARGET" --profile production --rps 1 --max-requests 50 --max-seconds 120 --output reports --fail-on low
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: target-report
          path: reports/
          retention-days: 7
